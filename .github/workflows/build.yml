name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.agent }} sandbox
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent:
          - codex
          - claude
          - opencode
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and check image
        env:
          SBXS_AGENTS: ${{ matrix.agent }}
        run: make verify

      - name: Set up QEMU
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          SBXS_REGISTRY: ghcr.io/${{ github.repository_owner }}/
          SBXS_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
        run: |
          cd src
          docker buildx bake "${{ matrix.agent }}-publish" --push
